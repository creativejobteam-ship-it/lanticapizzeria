<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'ANTICA Pizzeria</title>
    <!-- Tailwind CDN utilisé ici car le package npm n'est pas dans le package.json -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Yellowtail&display=swap" rel="stylesheet">
    <style>
      /* Custom scrollbar for a premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F9F5F0;
      }
      ::-webkit-scrollbar-thumb {
        background: #0D2922;
        border-radius: 4px;
      }
      /* Configuration des couleurs pour le CDN */
      :root {
        --color-mazzo-red: #D32F2F;
        --color-mazzo-cream: #F9F5F0;
        --color-mazzo-green: #0D2922;
        --color-mazzo-lime: #03933e;
      }
    </style>
    <script>
      // Configuration Tailwind pour le CDN
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'mazzo-red': '#D32F2F',
              'mazzo-cream': '#F9F5F0',
              'mazzo-green': '#0D2922',
              'mazzo-lime': '#03933e',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"DM Sans"', 'sans-serif'],
              script: ['"Yellowtail"', 'cursive'],
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "path": "https://esm.sh/path@^0.12.7"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-mazzo-cream text-gray-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
